name: CI

# 改為手動觸發：私有 repo 的 Actions 分鐘數已踩到 free tier 上限，自動 push/PR 觸發
# 會持續空耗額度（且不影響 GitHub Pages 部署——Pages 是獨立的 workflow，跟這條 CI 無關）。
# 額度恢復、或改成 public repo（Actions 分鐘數無限）後，可改回 on: push / pull_request，
# 或直接在 GitHub Actions 頁面手動點「Run workflow」跑一次驗收。
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 型別檢查
        run: npm run typecheck
      - name: 單元測試
        run: npm run test:unit
      - name: Build
        run: npm run build
      - name: 安裝 Chromium（Playwright）
        run: npx playwright install --with-deps chromium
      - name: 冒煙 / 回歸測試
        run: npm run test:smoke
