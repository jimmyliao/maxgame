name: CI

# 每次 push / PR 自動跑：型別檢查 + 單元測試 + build + 冒煙/回歸測試
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 型別檢查
        run: npm run typecheck
      - name: 單元測試
        run: npm run test:unit
      - name: Build
        run: npm run build
      - name: 安裝 Chromium（Playwright）
        run: npx playwright install --with-deps chromium
      - name: 冒煙 / 回歸測試
        run: npm run test:smoke
