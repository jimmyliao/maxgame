<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>守土 · 福爾摩沙衛士</title>
<meta name="theme-color" content="#1b5e20">
<!-- iOS 加到主畫面、全螢幕 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="守土">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; overflow:hidden; background:#0d2818;
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    -webkit-user-select:none; user-select:none; touch-action:none; }
  #app{ position:fixed; inset:0; display:flex; flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  /* 頂部資訊列 */
  #hud{ display:flex; align-items:center; gap:8px; padding:8px 12px; color:#e8f5e9;
    font-weight:700; font-size:13px; flex-wrap:wrap; }
  .pill{ background:rgba(255,255,255,.1); padding:4px 10px; border-radius:20px; white-space:nowrap; }
  #hp{ color:#ff8a80; }
  #wave{ color:#fff59d; }
  #score{ color:#a5d6a7; }
  #time{ color:#90caf9; }
  /* 畫布 */
  #stage{ flex:1; position:relative; min-height:0; }
  canvas{ display:block; width:100%; height:100%; touch-action:none; }
  /* 底部控制列 */
  #dock{ display:flex; gap:6px; padding:8px; padding-bottom:max(8px,env(safe-area-inset-bottom));
    background:rgba(0,0,0,.25); }
  .hero{ position:relative; flex:1; border:none; border-radius:14px; overflow:hidden;
    background:#2e7d32; color:#fff; padding:8px 2px 6px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    box-shadow:0 2px 0 rgba(0,0,0,.3); transition:transform .05s; }
  .hero:active{ transform:translateY(1px); }
  .hero.sel{ background:#66bb6a; outline:3px solid #fff; }
  .hero .emoji{ font-size:24px; line-height:1; }
  .hero .nm{ font-size:11px; font-weight:700; }
  .hero .key{ font-size:9px; opacity:.6; }
  .hero .cd{ position:absolute; left:0; bottom:0; width:100%; background:rgba(0,0,0,.45); height:0%; pointer-events:none; }
  #fusion{ flex:1.2; background:linear-gradient(#455a64,#37474f); }
  #fusion.ready{ background:linear-gradient(#ffd54f,#ffb300); color:#3e2723;
    animation:glow 1s ease-in-out infinite; }
  @keyframes glow{ 0%,100%{ box-shadow:0 0 0 rgba(255,193,7,0); } 50%{ box-shadow:0 0 16px rgba(255,193,7,.9);} }
  #fusion .fill{ position:absolute; left:0; bottom:0; width:100%; background:rgba(255,213,79,.35); height:0%; pointer-events:none; }
  /* 覆蓋畫面（開始/結束） */
  #overlay{ position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; color:#e8f5e9;
    background:rgba(7,20,12,.82); padding:20px; z-index:5; }
  #overlay.hide{ display:none; }
  #overlay h1{ font-size:30px; margin-bottom:6px; letter-spacing:2px; }
  #overlay h2{ font-size:18px; color:#a5d6a7; margin-bottom:14px; }
  #overlay p{ font-size:14px; line-height:1.7; color:#c8e6c9; max-width:440px; margin-bottom:8px; }
  #overlay .big{ margin-top:14px; background:#43a047; color:#fff; border:none;
    padding:14px 34px; font-size:18px; font-weight:800; border-radius:30px; cursor:pointer;
    box-shadow:0 4px 0 #2e7d32; }
  #overlay .big:active{ transform:translateY(2px); box-shadow:0 2px 0 #2e7d32; }
  .roster{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin:10px 0 4px; font-size:13px; }
  .roster b{ font-size:20px; display:block; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <span class="pill">棲地 <span id="hp">❤❤❤</span></span>
    <span class="pill" id="wave">第 1 波</span>
    <span class="pill">守退 <span id="score">0</span></span>
    <span class="pill">⏱ <span id="time">0:00</span></span>
  </div>
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="overlay">
      <h1>守土 · 福爾摩沙衛士</h1>
      <h2>守護台灣特有種的最後棲地</h2>
      <p>外來入侵種正湧入家園。你操控台灣特有種，點畫面施放技能，擋下三波攻勢、守住中央的巢！</p>
      <div class="roster">
        <span><b>🐆</b>石虎<br>衝刺突刺</span>
        <span><b>🐻</b>黑熊<br>震地重擊</span>
        <span><b>🦗</b>爺蟬<br>音波震暈</span>
        <span><b>🪰</b>勾蜓<br>高速掃場</span>
      </div>
      <p style="color:#ffd54f">集滿能量按「融合」→ 四獸合體，一招清場！</p>
      <button class="big" id="startBtn">開始守土</button>
      <p style="font-size:12px;opacity:.7;margin-top:14px">點下方切換角色，點畫面施放技能　·　桌機：1234 切換、點擊施放、F 融合</p>
    </div>
  </div>
  <div id="dock">
    <button class="hero sel" data-i="0"><div class="cd"></div><span class="emoji">🐆</span><span class="nm">石虎</span><span class="key">1</span></button>
    <button class="hero" data-i="1"><div class="cd"></div><span class="emoji">🐻</span><span class="nm">黑熊</span><span class="key">2</span></button>
    <button class="hero" data-i="2"><div class="cd"></div><span class="emoji">🦗</span><span class="nm">爺蟬</span><span class="key">3</span></button>
    <button class="hero" data-i="3"><div class="cd"></div><span class="emoji">🪰</span><span class="nm">勾蜓</span><span class="key">4</span></button>
    <button class="hero" id="fusion"><div class="fill"></div><span class="emoji">✨</span><span class="nm">融合</span><span class="key">F</span></button>
  </div>
</div>

<script>
(() => {
  "use strict";
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const elHp = document.getElementById("hp");
  const elWave = document.getElementById("wave");
  const elScore = document.getElementById("score");
  const elTime = document.getElementById("time");
  const overlay = document.getElementById("overlay");
  const startBtn = document.getElementById("startBtn");
  const heroBtns = [...document.querySelectorAll(".hero[data-i]")];
  const fusionBtn = document.getElementById("fusion");

  let W = 0, H = 0, dpr = 1;
  function resize() {
    const r = canvas.getBoundingClientRect();
    W = r.width; H = r.height;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);

  // ---- 角色（台灣特有種）----
  const HEROES = [
    { name:"石虎", emoji:"🐆", cd:0.5,  dmg:2, color:"#ffb74d", type:"dash" },
    { name:"黑熊", emoji:"🐻", cd:2.2,  dmg:2, color:"#8d6e63", type:"slam" },
    { name:"爺蟬", emoji:"🦗", cd:3.0,  dmg:1, color:"#aed581", type:"sonic" },
    { name:"勾蜓", emoji:"🪰", cd:2.5,  dmg:1, color:"#4dd0e1", type:"sweep" },
  ];
  // ---- 敵人（外來入侵種）----
  const ENEMIES = {
    snail:  { name:"福壽螺", emoji:"🐌", hp:1, speed:26, r:16, dmg:1, energy:7 },
    iguana: { name:"綠鬣蜥", emoji:"🦎", hp:4, speed:34, r:20, dmg:1, energy:12 },
    frog:   { name:"斑腿樹蛙", emoji:"🐸", hp:1, speed:60, r:15, dmg:1, energy:8 },
    ibis:   { name:"埃及聖䴉", emoji:"🦤", hp:2, speed:50, r:18, dmg:2, energy:12 },
  };
  // ---- 三波攻勢 ----
  const WAVES = [
    [ {t:"snail",n:8} ],
    [ {t:"snail",n:6}, {t:"iguana",n:5} ],
    [ {t:"iguana",n:5}, {t:"frog",n:8}, {t:"ibis",n:5} ],
  ];

  const FUSION_MAX = 100;
  const HAB_HP = 12;

  let state, hero, cools, enemies, effects, floaters;
  let habHp, score, energy, fusionReady, shake, elapsed;
  let waveIdx, spawnQueue, spawnTimer, betweenTimer, waveBanner;
  let hab; // habitat position

  function reset() {
    state = "menu";
    hero = 0;
    cools = [0,0,0,0];
    enemies = []; effects = []; floaters = [];
    habHp = HAB_HP; score = 0; energy = 0; fusionReady = false;
    shake = 0; elapsed = 0;
    waveIdx = 0; spawnQueue = []; spawnTimer = 0; betweenTimer = 0; waveBanner = 0;
    selectHero(0);
    updateHud();
  }

  function startGame() {
    reset();
    state = "play";
    overlay.classList.add("hide");
    startWave(0);
  }

  function startWave(i) {
    waveIdx = i;
    spawnQueue = [];
    for (const grp of WAVES[i]) for (let k=0;k<grp.n;k++) spawnQueue.push(grp.t);
    // 洗牌，讓敵人混著出現
    for (let a=spawnQueue.length-1;a>0;a--){ const b=(elapsed*97+a*13)%(a+1)|0; const t=spawnQueue[a]; spawnQueue[a]=spawnQueue[b]; spawnQueue[b]=t; }
    spawnTimer = 0.4;
    waveBanner = 1.6;
    elWave.textContent = "第 " + (i+1) + " 波";
  }

  function selectHero(i) {
    hero = i;
    heroBtns.forEach((b,k)=> b.classList.toggle("sel", k===i));
  }

  // ---- 生成敵人 ----
  function spawnEnemy(type) {
    const def = ENEMIES[type];
    let x, y;
    const edge = type==="ibis" ? 2 : (Math.floor((elapsed*53 + enemies.length*31) % 3));
    const m = 30;
    if (edge===0){ x=-m; y=Math.random()*H; }           // 左
    else if (edge===1){ x=W+m; y=Math.random()*H; }      // 右
    else { x=Math.random()*W; y=-m; }                    // 上
    enemies.push({ type, x, y, hp:def.hp, maxhp:def.hp, r:def.r, stun:0, hitFlash:0 });
  }

  // ---- 施放技能 ----
  function cast(px, py) {
    if (state!=="play") return;
    if (cools[hero] > 0) return;
    const h = HEROES[hero];
    cools[hero] = h.cd;
    if (h.type==="dash") {
      // 找離點擊處最近的敵人，衝過去秒擊
      let best=null, bd=80*80;
      for (const e of enemies){ const dx=e.x-px, dy=e.y-py, d=dx*dx+dy*dy; if(d<bd){bd=d;best=e;} }
      if (best){ damage(best, h.dmg); effects.push({type:"dash", x1:hab.x,y1:hab.y,x2:best.x,y2:best.y,life:0.18,max:0.18}); }
      else { effects.push({type:"dash", x1:hab.x,y1:hab.y,x2:px,y2:py,life:0.12,max:0.12}); }
    } else if (h.type==="slam") {
      const R=85; effects.push({type:"slam",x:px,y:py,r:R,life:0.35,max:0.35});
      for (const e of enemies){ const dx=e.x-px,dy=e.y-py; if(dx*dx+dy*dy < R*R){ damage(e,h.dmg);
        const d=Math.hypot(dx,dy)||1; e.x+=dx/d*30; e.y+=dy/d*30; } }
      shake = Math.max(shake, 8);
    } else if (h.type==="sonic") {
      const R=Math.max(W,H); effects.push({type:"sonic",x:hab.x,y:hab.y,r:R,life:0.55,max:0.55});
      for (const e of enemies){ damage(e,h.dmg); e.stun=1.2; e.hitFlash=0.2; }
    } else if (h.type==="sweep") {
      const band=46; effects.push({type:"sweep",y:py,life:0.22,max:0.22});
      for (const e of enemies){ if(Math.abs(e.y-py)<band){ damage(e,h.dmg); } }
    }
  }

  function damage(e, d) {
    e.hp -= d; e.hitFlash = 0.15;
    if (e.hp <= 0) {
      const def = ENEMIES[e.type];
      score++; addEnergy(def.energy);
      floaters.push({x:e.x,y:e.y,txt:"+1",life:0.7,col:"#a5d6a7"});
      effects.push({type:"pop",x:e.x,y:e.y,life:0.3,max:0.3});
      e.dead = true;
    }
  }

  function addEnergy(v) {
    if (fusionReady) return;
    energy = Math.min(FUSION_MAX, energy + v);
    if (energy >= FUSION_MAX){ fusionReady = true; fusionBtn.classList.add("ready"); }
  }

  function doFusion() {
    if (state!=="play" || !fusionReady) return;
    fusionReady = false; energy = 0; fusionBtn.classList.remove("ready");
    effects.push({type:"fusion",x:hab.x,y:hab.y,r:Math.max(W,H)*1.1,life:0.7,max:0.7});
    for (const e of enemies){ score++; }
    enemies = [];
    habHp = Math.min(HAB_HP, habHp+2);
    shake = 14;
    floaters.push({x:hab.x,y:hab.y-40,txt:"融合·守土！",life:1.2,col:"#ffd54f",big:true});
    updateHud();
  }

  // ---- 主迴圈 ----
  let last = 0;
  function frame(ts) {
    const dt = Math.min(0.04, (ts - last)/1000 || 0); last = ts;
    if (state==="play") update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  function update(dt) {
    elapsed += dt;
    hab = { x: W/2, y: H*0.56, r: 30 };

    for (let i=0;i<4;i++) if (cools[i]>0) cools[i]=Math.max(0,cools[i]-dt);
    if (waveBanner>0) waveBanner-=dt;
    if (shake>0) shake=Math.max(0,shake-dt*40);

    // 生成
    if (spawnQueue.length){
      spawnTimer -= dt;
      if (spawnTimer<=0){ spawnEnemy(spawnQueue.shift()); spawnTimer = Math.max(0.35, 1.1 - waveIdx*0.18); }
    }

    // 敵人移動
    for (const e of enemies){
      const def = ENEMIES[e.type];
      if (e.hitFlash>0) e.hitFlash-=dt;
      let sp = def.speed; if (e.stun>0){ e.stun-=dt; sp=0; }
      const dx=hab.x-e.x, dy=hab.y-e.y, d=Math.hypot(dx,dy)||1;
      e.x += dx/d*sp*dt; e.y += dy/d*sp*dt;
      if (d < hab.r + e.r){ // 攻到棲地
        habHp -= def.dmg; e.dead=true; shake=Math.max(shake,7);
        floaters.push({x:hab.x,y:hab.y,txt:"-"+def.dmg,life:0.7,col:"#ff8a80"});
      }
    }
    enemies = enemies.filter(e=>!e.dead);

    // 特效 / 浮字
    for (const ef of effects) ef.life-=dt;
    effects = effects.filter(ef=>ef.life>0);
    for (const f of floaters){ f.life-=dt; f.y-=20*dt; }
    floaters = floaters.filter(f=>f.life>0);

    // 波次結束判定
    if (spawnQueue.length===0 && enemies.length===0 && betweenTimer<=0 && waveBanner<=0){
      if (waveIdx < WAVES.length-1){ betweenTimer = 1.4; }
      else { win(); }
    }
    if (betweenTimer>0){ betweenTimer-=dt; if (betweenTimer<=0) startWave(waveIdx+1); }

    if (habHp<=0){ habHp=0; lose(); }
    updateHud();
  }

  function win(){ state="win"; showOverlay(
    "🌿 守住家園！", "你成功擊退三波入侵種",
    `守退 ${score} 隻外來種，棲地保住了 ${habHp} 點生命。<br>台灣特有種的家，因為你而安全了一天。`,
    "再守一次"); }
  function lose(){ state="lose"; showOverlay(
    "棲地失守…", "外來種攻破了巢",
    `你守退了 ${score} 隻入侵種。<br>再試一次，這次換隻角色、早點用融合大絕！`,
    "重新守土"); }

  function showOverlay(h1,h2,p,btn){
    overlay.innerHTML = `<h1>${h1}</h1><h2>${h2}</h2><p>${p}</p>`+
      `<button class="big" id="againBtn">${btn}</button>`+
      `<p style="font-size:12px;opacity:.7;margin-top:14px">提示：石虎秒小怪、黑熊清成堆、爺蟬震暈一片、勾蜓掃整排</p>`;
    overlay.classList.remove("hide");
    document.getElementById("againBtn").onclick = startGame;
  }

  function updateHud(){
    elHp.textContent = habHp>0 ? "❤".repeat(Math.ceil(habHp/2)) : "💀";
    elScore.textContent = score;
    const s=Math.floor(elapsed); elTime.textContent = Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
    for (let i=0;i<4;i++){ const cd=heroBtns[i].querySelector(".cd");
      cd.style.height = (cools[i]/HEROES[i].cd*100)+"%"; }
    fusionBtn.querySelector(".fill").style.height = (energy/FUSION_MAX*100)+"%";
  }

  // ---- 繪製 ----
  function draw(){
    ctx.save();
    let ox=0, oy=0;
    if (shake>0){ ox=(Math.random()-0.5)*shake; oy=(Math.random()-0.5)*shake; ctx.translate(ox,oy); }

    // 背景：森林漸層 + 地面紋理
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,"#1b5e20"); g.addColorStop(1,"#33691e");
    ctx.fillStyle=g; ctx.fillRect(-20,-20,W+40,H+40);
    ctx.globalAlpha=0.06; ctx.fillStyle="#fff";
    for(let i=0;i<6;i++){ ctx.beginPath(); ctx.arc((i*173%W),(i*97%H),60,0,7); ctx.fill(); }
    ctx.globalAlpha=1;

    if (!hab) hab={x:W/2,y:H*0.56,r:30};

    // 棲地（巢）光環
    const pulse = 1+0.06*Math.sin(elapsed*4);
    ctx.beginPath(); ctx.arc(hab.x,hab.y,hab.r*1.7*pulse,0,7);
    ctx.fillStyle="rgba(255,241,118,.12)"; ctx.fill();
    ctx.beginPath(); ctx.arc(hab.x,hab.y,hab.r,0,7);
    ctx.fillStyle="#5d4037"; ctx.fill();
    ctx.font="30px serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText("🪺", hab.x, hab.y+1);

    // 守護者（目前角色）站在巢上
    const h=HEROES[hero];
    ctx.font="34px serif";
    ctx.fillText(h.emoji, hab.x, hab.y - hab.r - 14);

    // 特效（敵人下方）
    for (const ef of effects){
      const a = ef.life/ef.max;
      if (ef.type==="dash"){ ctx.strokeStyle="rgba(255,183,77,"+a+")"; ctx.lineWidth=6*a+2;
        ctx.beginPath(); ctx.moveTo(ef.x1,ef.y1); ctx.lineTo(ef.x2,ef.y2); ctx.stroke(); }
      else if (ef.type==="slam"){ const r=ef.r*(1-a); ctx.strokeStyle="rgba(141,110,99,"+a+")"; ctx.lineWidth=8;
        ctx.beginPath(); ctx.arc(ef.x,ef.y,r,0,7); ctx.stroke(); }
      else if (ef.type==="sonic"){ const r=ef.r*(1-a); ctx.strokeStyle="rgba(174,213,129,"+(a*0.9)+")"; ctx.lineWidth=10;
        ctx.beginPath(); ctx.arc(ef.x,ef.y,r,0,7); ctx.stroke(); }
      else if (ef.type==="sweep"){ ctx.fillStyle="rgba(77,208,225,"+(a*0.5)+")"; ctx.fillRect(0,ef.y-23,W,46); }
      else if (ef.type==="fusion"){ const r=ef.r*(1-a); ctx.fillStyle="rgba(255,213,79,"+(a*0.5)+")";
        ctx.beginPath(); ctx.arc(ef.x,ef.y,r,0,7); ctx.fill(); }
      else if (ef.type==="pop"){ ctx.fillStyle="rgba(255,255,255,"+a+")";
        ctx.beginPath(); ctx.arc(ef.x,ef.y,18*(1-a)+4,0,7); ctx.fill(); }
    }

    // 敵人
    ctx.textAlign="center"; ctx.textBaseline="middle";
    for (const e of enemies){
      const def=ENEMIES[e.type];
      if (e.stun>0){ ctx.font="12px serif"; ctx.fillText("💫", e.x+e.r*0.6, e.y-e.r*0.7); }
      ctx.font = (e.r*1.9|0)+"px serif";
      if (e.hitFlash>0){ ctx.globalAlpha=0.5; }
      ctx.fillText(def.emoji, e.x, e.y);
      ctx.globalAlpha=1;
      // 血條（被打過、且不只 1 滴血才顯示）
      if (e.maxhp>1 && e.hp<e.maxhp){ const w=e.r*1.6, hpw=w*e.hp/e.maxhp;
        ctx.fillStyle="rgba(0,0,0,.4)"; ctx.fillRect(e.x-w/2,e.y-e.r-8,w,4);
        ctx.fillStyle="#ff8a80"; ctx.fillRect(e.x-w/2,e.y-e.r-8,hpw,4); }
    }

    // 浮字
    for (const f of floaters){ const a=Math.min(1,f.life*1.6);
      ctx.globalAlpha=a; ctx.fillStyle=f.col; ctx.font=(f.big?"bold 22px":"bold 15px")+" sans-serif";
      ctx.fillText(f.txt,f.x,f.y); ctx.globalAlpha=1; }

    // 波次橫幅
    if (waveBanner>0 && state==="play"){ const a=Math.min(1,waveBanner);
      ctx.globalAlpha=a; ctx.fillStyle="#fff59d"; ctx.font="bold 30px sans-serif";
      ctx.fillText("第 "+(waveIdx+1)+" 波 來襲！", W/2, H*0.28); ctx.globalAlpha=1; }

    ctx.restore();
  }

  // ---- 輸入 ----
  function toCanvas(clientX, clientY){
    const r=canvas.getBoundingClientRect();
    return [clientX-r.left, clientY-r.top];
  }
  canvas.addEventListener("pointerdown",(e)=>{ e.preventDefault();
    const [x,y]=toCanvas(e.clientX,e.clientY); cast(x,y); }, {passive:false});

  heroBtns.forEach(b=> b.addEventListener("pointerdown",(e)=>{ e.preventDefault();
    selectHero(+b.dataset.i); }, {passive:false}) );
  fusionBtn.addEventListener("pointerdown",(e)=>{ e.preventDefault(); doFusion(); }, {passive:false});
  startBtn.addEventListener("click", startGame);

  window.addEventListener("keydown",(e)=>{
    if (e.key>="1" && e.key<="4"){ selectHero(+e.key-1); }
    else if (e.key==="f"||e.key==="F"){ doFusion(); }
    else if (e.code==="Space"){ e.preventDefault();
      if (state==="menu"||state==="win"||state==="lose") startGame();
      else cast(hab.x, hab.y-80); }
  });

  // 啟動
  resize(); reset();
  requestAnimationFrame(frame);

  // 註冊 Service Worker（離線可玩）
  if ("serviceWorker" in navigator){
    window.addEventListener("load",()=> navigator.serviceWorker.register("sw.js").catch(()=>{}));
  }
})();
</script>
</body>
</html>
