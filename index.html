<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>守土 · 福爾摩沙衛士</title>
<meta name="theme-color" content="#1b5e20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="守土">
<link rel="icon" href="icon.svg">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; overflow:hidden; background:#0d2818;
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    -webkit-user-select:none; user-select:none; touch-action:none; color:#e8f5e9; }
  #app{ position:fixed; inset:0; display:flex; flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #stage{ flex:1; position:relative; min-height:0; }
  canvas#game{ display:block; width:100%; height:100%; touch-action:none; }
  #dock{ display:flex; justify-content:space-between; align-items:flex-end; gap:6px;
    padding:10px 12px; padding-bottom:max(10px,env(safe-area-inset-bottom)); }
  #dock.hide{ display:none; }
  .pad{ display:flex; gap:8px; align-items:center; }
  .gb{ border:none; border-radius:50%; width:60px; height:60px; font-size:13px; font-weight:800; color:#fff;
    background:#2e7d32; box-shadow:0 3px 0 rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center;
    position:relative; overflow:hidden; cursor:pointer; flex:none; }
  .gb:active,.gb.on{ transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.35); filter:brightness(1.2); }
  .gb.move{ background:#455a64; font-size:22px; }
  .gb.sw{ background:#00897b; font-size:12px; }
  .gb.jump{ background:#0277bd; }
  .gb.atk{ background:#c62828; width:70px; height:70px; font-size:15px; }
  .gb.sp{ background:#6a1b9a; width:70px; height:70px; }
  .gb.sp.ready{ animation:glow 1s infinite; }
  @keyframes glow{ 0%,100%{ box-shadow:0 3px 0 rgba(0,0,0,.35);} 50%{ box-shadow:0 0 16px #ce93d8;} }
  .gb .fill{ position:absolute; left:0; bottom:0; width:100%; background:rgba(0,0,0,.5); height:0%; pointer-events:none; }
  .scr{ position:absolute; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:20px; background:rgba(7,20,12,.92); overflow:auto; }
  .scr.hide{ display:none; }
  .scr h1{ font-size:28px; letter-spacing:2px; margin-bottom:6px; }
  .scr h2{ font-size:16px; color:#a5d6a7; margin-bottom:14px; }
  .scr p{ font-size:14px; line-height:1.7; color:#c8e6c9; max-width:460px; margin-bottom:8px; }
  .btn{ margin-top:12px; background:#43a047; color:#fff; border:none; padding:12px 28px; font-size:16px; font-weight:800;
    border-radius:30px; cursor:pointer; box-shadow:0 4px 0 #2e7d32; }
  .btn:active{ transform:translateY(2px); box-shadow:0 2px 0 #2e7d32; }
  .btn.sec{ background:#546e7a; box-shadow:0 4px 0 #37474f; font-size:14px; padding:9px 20px; }
  .row{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  #map .cards,#dex .cards{ display:flex; flex-direction:column; gap:10px; width:100%; max-width:480px; margin-top:6px; }
  .card{ display:flex; align-items:center; gap:12px; background:rgba(255,255,255,.08); border-radius:16px; padding:10px 12px;
    cursor:pointer; text-align:left; border:2px solid transparent; }
  .card.locked{ opacity:.45; cursor:not-allowed; } .card.cleared{ border-color:#66bb6a; }
  .card canvas{ width:52px; height:52px; flex:none; }
  .card .info{ flex:1; } .card .info .t{ font-size:15px; font-weight:800; color:#fff; }
  .card .info .d{ font-size:12px; color:#b0bec5; margin-top:2px; line-height:1.5; } .card .st{ font-size:20px; }
  .dexhdr{ font-size:15px; font-weight:800; color:#ffd54f; margin:14px 0 2px; }
  .badge{ display:inline-block; font-size:11px; padding:1px 7px; border-radius:10px; margin-right:5px; }
  .b-end{ background:#1b5e20; color:#a5d6a7; } .b-inv{ background:#5d1a1a; color:#ffab91; }
  #story{ position:absolute; inset:0; z-index:12; display:flex; flex-direction:column; justify-content:flex-end; }
  #story.hide{ display:none; }
  #story .sky{ position:absolute; inset:0; }
  #story .box{ position:relative; margin:14px; margin-bottom:max(14px,env(safe-area-inset-bottom));
    background:rgba(10,26,16,.94); border:2px solid #66bb6a; border-radius:18px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; }
  #story .box canvas{ width:64px; height:64px; flex:none; background:rgba(255,255,255,.06); border-radius:12px; }
  #story .box .tx{ flex:1; } #story .box .nm{ font-size:14px; font-weight:800; color:#ffd54f; margin-bottom:4px; }
  #story .box .ln{ font-size:15px; line-height:1.6; color:#e8f5e9; min-height:46px; }
  #story .tap{ position:absolute; right:16px; bottom:8px; font-size:11px; color:#90a4ae; }
  /* ===== 大廳 Lobby（遊戲介面，荒野亂鬥式氛圍）===== */
  #lobby{ padding:0; overflow:hidden; }
  #lobby #heroShow{ position:absolute; inset:0; width:100%; height:100%; z-index:0; }
  #lobby .lb-top{ position:absolute; top:0; left:0; right:0; z-index:2; display:flex; align-items:flex-start;
    justify-content:space-between; gap:8px; padding:10px 12px; padding-top:max(10px,env(safe-area-inset-top)); }
  #lobby .lb-profile{ display:flex; align-items:center; gap:8px; background:rgba(8,24,16,.6); border:1px solid rgba(255,255,255,.18);
    border-radius:30px; padding:5px 12px 5px 5px; box-shadow:0 2px 8px rgba(0,0,0,.4); }
  #lobby .lb-ava{ width:34px; height:34px; border-radius:50%; background:linear-gradient(#43a047,#1b5e20);
    display:flex; align-items:center; justify-content:center; font-size:18px; border:2px solid #ffd54f; }
  #lobby .lb-name{ font-size:13px; font-weight:900; color:#fff; line-height:1.1; }
  #lobby .lb-lv{ font-size:11px; color:#a5d6a7; }
  #lobby .lb-curr{ display:flex; gap:6px; }
  #lobby .lb-pill{ background:rgba(8,24,16,.6); border:1px solid rgba(255,255,255,.18); border-radius:20px;
    padding:6px 12px; font-size:13px; font-weight:800; color:#e8f5e9; box-shadow:0 2px 8px rgba(0,0,0,.4); white-space:nowrap; }
  #lobby .lb-pill b{ color:#ffd54f; }
  #lobby .lb-ticker{ position:absolute; top:max(58px,calc(env(safe-area-inset-top) + 50px)); left:0; right:0; z-index:2;
    background:rgba(8,24,16,.45); padding:5px 14px; font-size:12px; color:#d4ecc4; white-space:nowrap; overflow:hidden;
    border-top:1px solid rgba(255,255,255,.08); border-bottom:1px solid rgba(255,255,255,.08); }
  #lobby .lb-ticker span{ display:inline-block; }
  #lobby .lb-bottom{ position:absolute; left:0; right:0; bottom:0; z-index:2; display:flex; flex-direction:column;
    align-items:center; padding:0 16px 14px; padding-bottom:max(14px,env(safe-area-inset-bottom));
    background:linear-gradient(rgba(7,20,12,0), rgba(7,20,12,.55) 30%, rgba(7,20,12,.85)); }
  #lobby .hero-name{ font-size:26px; font-weight:900; color:#fff; text-shadow:0 3px 10px rgba(0,0,0,.7); }
  #lobby .hero-name .ht{ font-size:15px; color:#ffd54f; margin-left:8px; }
  #lobby .hero-tag{ font-size:13px; color:#d4ecc4; margin-top:4px; text-align:center; padding:0 12px; text-shadow:0 1px 4px rgba(0,0,0,.6); }
  #lobby .roster{ display:flex; gap:9px; justify-content:center; padding:11px 0 12px; flex-wrap:wrap; }
  #lobby .rb{ width:56px; height:56px; border-radius:16px; border:2px solid rgba(255,255,255,.22);
    background:rgba(0,0,0,.35); cursor:pointer; padding:0; overflow:hidden; box-shadow:0 2px 6px rgba(0,0,0,.4); }
  #lobby .rb.sel{ border-color:#ffd54f; box-shadow:0 0 16px rgba(255,213,79,.7); transform:translateY(-2px); }
  #lobby .rb canvas{ width:100%; height:100%; display:block; }
  #lobby .play-btn{ position:relative; overflow:hidden; width:100%; max-width:420px; border:none; border-radius:30px;
    background:linear-gradient(#ffe082,#ffb300); color:#3e2723; font-size:22px; font-weight:900; letter-spacing:2px;
    padding:16px; cursor:pointer; animation:playPulse 1.6s ease-in-out infinite; }
  #lobby .play-btn::after{ content:""; position:absolute; top:0; left:-70%; width:45%; height:100%;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,.75), transparent); transform:skewX(-20deg);
    animation:playShine 2.6s ease-in-out infinite; pointer-events:none; }
  #lobby .play-btn:active{ transform:translateY(3px); }
  @keyframes playPulse{ 0%,100%{ box-shadow:0 6px 0 #e09400, 0 10px 24px rgba(0,0,0,.5), 0 0 0 rgba(255,213,79,0);} 50%{ box-shadow:0 6px 0 #e09400, 0 10px 30px rgba(0,0,0,.5), 0 0 26px rgba(255,213,79,.85);} }
  @keyframes playShine{ 0%{ left:-70%;} 55%,100%{ left:150%;} }
  #lobby .lobby-nav{ display:flex; gap:10px; justify-content:center; margin-top:10px; width:100%; max-width:420px; }
  #lobby .navb{ flex:1; background:rgba(255,255,255,.13); border:1px solid rgba(255,255,255,.22);
    color:#e8f5e9; font-size:14px; font-weight:800; border-radius:20px; padding:11px; cursor:pointer; }
  #lobby .navb:active{ filter:brightness(1.25); }
  /* ===== 場景轉場 ===== */
  #xfade{ position:fixed; inset:0; z-index:50; opacity:0; pointer-events:none;
    background:radial-gradient(circle at 50% 45%, #14422a, #06170d);
    display:flex; align-items:center; justify-content:center; transition:opacity .22s ease; }
  #xfade.on{ opacity:1; pointer-events:all; }
  #xfade .xe{ font-size:46px; filter:drop-shadow(0 4px 10px rgba(0,0,0,.5)); opacity:0; transition:opacity .22s ease; }
  #xfade.on .xe{ opacity:1; animation:xspin .9s ease-in-out infinite; }
  @keyframes xspin{ 0%{ transform:rotate(-12deg) scale(.92);} 50%{ transform:rotate(12deg) scale(1.05);} 100%{ transform:rotate(-12deg) scale(.92);} }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game"></canvas>

    <div class="scr" id="lobby">
      <canvas id="heroShow"></canvas>
      <div class="lb-top">
        <div class="lb-profile">
          <div class="lb-ava">🛡️</div>
          <div class="lb-meta"><div class="lb-name">守護者</div><div class="lb-lv">保育等級 Lv.<span id="trophyVal">1</span></div></div>
        </div>
        <div class="lb-curr"><span class="lb-pill">🌿 保育值 <b id="ecoVal">0</b></span></div>
      </div>
      <div class="lb-ticker"><span id="lbTicker">　</span></div>
      <div class="lb-bottom">
        <div class="hero-name"><span id="hsName">石虎</span><span class="ht" id="hsType">🌲山林</span></div>
        <div class="hero-tag" id="hsTag"></div>
        <div class="roster" id="roster"></div>
        <button class="play-btn" id="playBtn">⚔ 對 戰</button>
        <div class="lobby-nav">
          <button class="navb" id="navDex">📖 圖鑑</button>
          <button class="navb" id="navReset">↺ 重置</button>
        </div>
      </div>
    </div>

    <div class="scr hide" id="title">
      <h1>守土 · 福爾摩沙衛士</h1>
      <h2>守護台灣特有種 · 對抗外來入侵種</h2>
      <p>這是一款用「玩」來認識台灣生態的遊戲。<br>操控真實的台灣特有種，組隊、運用棲地屬性相剋，打倒入侵種的王，守住每一個正在消失的家。</p>
      <p style="color:#ffd54f">🌏 每打倒一隻，就在保育圖鑑裡多認識一種台灣生命。</p>
      <button class="btn" id="toMap">開始冒險</button>
    </div>

    <div class="scr hide" id="map">
      <h1 style="font-size:23px">選擇章節</h1>
      <div class="cards" id="cards"></div>
      <div class="row" style="margin-top:16px">
        <button class="btn sec" id="mapHome">🏠 回大廳</button>
        <button class="btn sec" id="toDex">📖 保育圖鑑</button>
      </div>
    </div>

    <div class="scr hide" id="dex">
      <h1 style="font-size:22px">📖 保育圖鑑</h1>
      <p style="font-size:12px;margin-bottom:4px">認識牠們，是守護的第一步。</p>
      <div class="cards" id="dexCards"></div>
      <button class="btn sec" id="dexBack" style="margin-top:14px">返回</button>
    </div>

    <div id="story" class="hide">
      <canvas class="sky" id="storybg"></canvas>
      <div class="box">
        <canvas id="portrait" width="128" height="128"></canvas>
        <div class="tx"><div class="nm" id="spk"></div><div class="ln" id="line"></div></div>
        <div class="tap">點擊繼續 ▼</div>
      </div>
    </div>

    <div class="scr hide" id="result">
      <h1 id="rTitle"></h1><h2 id="rSub"></h2><p id="rBody"></p>
      <button class="btn" id="rMain"></button>
      <button class="btn sec" id="rMap">🏠 回大廳</button>
    </div>
  </div>

  <div id="dock" class="hide">
    <div class="pad">
      <button class="gb move" id="bLeft">◀</button>
      <button class="gb move" id="bRight">▶</button>
      <button class="gb sw" id="bSwap">換手</button>
    </div>
    <div class="pad">
      <button class="gb jump" id="bJump">跳</button>
      <button class="gb sp" id="bSp"><span class="fill"></span>必殺</button>
      <button class="gb atk" id="bAtk">攻擊</button>
    </div>
  </div>

  <div id="xfade"><div class="xe">🛡️</div></div>
</div>

<script type="module" src="./src/legacy.js"></script>
</body>
</html>
