<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>守土 · 福爾摩沙衛士</title>
<meta name="theme-color" content="#1b5e20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="守土">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; overflow:hidden; background:#0d2818;
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    -webkit-user-select:none; user-select:none; touch-action:none; color:#e8f5e9; }
  #app{ position:fixed; inset:0; display:flex; flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #stage{ flex:1; position:relative; min-height:0; }
  canvas#game{ display:block; width:100%; height:100%; touch-action:none; }
  /* 控制列 */
  #dock{ display:flex; justify-content:space-between; align-items:flex-end; gap:8px;
    padding:10px 14px; padding-bottom:max(10px,env(safe-area-inset-bottom)); }
  #dock.hide{ display:none; }
  .pad{ display:flex; gap:10px; align-items:center; }
  .gb{ border:none; border-radius:50%; width:64px; height:64px; font-size:14px; font-weight:800; color:#fff;
    background:#2e7d32; box-shadow:0 3px 0 rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center;
    position:relative; overflow:hidden; cursor:pointer; flex:none; }
  .gb:active,.gb.on{ transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.35); filter:brightness(1.2); }
  .gb.move{ background:#455a64; font-size:24px; }
  .gb.jump{ background:#0277bd; }
  .gb.atk{ background:#c62828; width:74px; height:74px; font-size:16px; }
  .gb.sp{ background:#6a1b9a; width:74px; height:74px; }
  .gb.sp.ready{ animation:glow 1s infinite; }
  @keyframes glow{ 0%,100%{ box-shadow:0 3px 0 rgba(0,0,0,.35);} 50%{ box-shadow:0 0 16px #ce93d8;} }
  .gb .fill{ position:absolute; left:0; bottom:0; width:100%; background:rgba(0,0,0,.5); height:0%; pointer-events:none; }
  /* 畫面 */
  .scr{ position:absolute; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:22px; background:rgba(7,20,12,.9); overflow:auto; }
  .scr.hide{ display:none; }
  .scr h1{ font-size:30px; letter-spacing:2px; margin-bottom:6px; }
  .scr h2{ font-size:17px; color:#a5d6a7; margin-bottom:16px; }
  .scr p{ font-size:14px; line-height:1.7; color:#c8e6c9; max-width:460px; margin-bottom:8px; }
  .btn{ margin-top:14px; background:#43a047; color:#fff; border:none; padding:13px 30px; font-size:17px; font-weight:800;
    border-radius:30px; cursor:pointer; box-shadow:0 4px 0 #2e7d32; }
  .btn:active{ transform:translateY(2px); box-shadow:0 2px 0 #2e7d32; }
  .btn.sec{ background:#546e7a; box-shadow:0 4px 0 #37474f; font-size:14px; padding:10px 22px; }
  #map .cards{ display:flex; flex-direction:column; gap:12px; width:100%; max-width:460px; margin-top:8px; }
  .card{ display:flex; align-items:center; gap:12px; background:rgba(255,255,255,.08); border-radius:16px; padding:12px 14px;
    cursor:pointer; text-align:left; border:2px solid transparent; }
  .card.locked{ opacity:.45; cursor:not-allowed; } .card.cleared{ border-color:#66bb6a; }
  .card canvas{ width:54px; height:54px; flex:none; }
  .card .info{ flex:1; } .card .info .t{ font-size:15px; font-weight:800; color:#fff; }
  .card .info .d{ font-size:12px; color:#b0bec5; margin-top:2px; } .card .st{ font-size:22px; }
  #story{ position:absolute; inset:0; z-index:12; display:flex; flex-direction:column; justify-content:flex-end; }
  #story.hide{ display:none; }
  #story .sky{ position:absolute; inset:0; }
  #story .box{ position:relative; margin:14px; margin-bottom:max(14px,env(safe-area-inset-bottom));
    background:rgba(10,26,16,.94); border:2px solid #66bb6a; border-radius:18px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; }
  #story .box canvas{ width:64px; height:64px; flex:none; background:rgba(255,255,255,.06); border-radius:12px; }
  #story .box .tx{ flex:1; } #story .box .nm{ font-size:14px; font-weight:800; color:#ffd54f; margin-bottom:4px; }
  #story .box .ln{ font-size:15px; line-height:1.6; color:#e8f5e9; min-height:48px; }
  #story .tap{ position:absolute; right:16px; bottom:8px; font-size:11px; color:#90a4ae; }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game"></canvas>

    <div class="scr" id="title">
      <h1>守土 · 福爾摩沙衛士</h1>
      <h2>台灣特有種 對決 外來入侵種</h2>
      <p>外來入侵種的「王」一隻隻出現，威脅台灣動物的家。<br>操控特有種，閃過牠的攻擊、抓住破綻反擊，打倒每一隻魔王！</p>
      <p style="color:#ffd54f">一場有故事的卡通對戰 🐾⚔️</p>
      <button class="btn" id="toMap">開始冒險</button>
    </div>

    <div class="scr hide" id="map">
      <h1 style="font-size:24px">選擇章節</h1>
      <div class="cards" id="cards"></div>
      <button class="btn sec" id="resetProg" style="margin-top:18px">重置進度</button>
    </div>

    <div id="story" class="hide">
      <canvas class="sky" id="storybg"></canvas>
      <div class="box">
        <canvas id="portrait" width="128" height="128"></canvas>
        <div class="tx"><div class="nm" id="spk"></div><div class="ln" id="line"></div></div>
        <div class="tap">點擊繼續 ▼</div>
      </div>
    </div>

    <div class="scr hide" id="result">
      <h1 id="rTitle"></h1><h2 id="rSub"></h2><p id="rBody"></p>
      <button class="btn" id="rMain"></button>
      <button class="btn sec" id="rMap">回章節地圖</button>
    </div>
  </div>

  <div id="dock" class="hide">
    <div class="pad">
      <button class="gb move" id="bLeft">◀</button>
      <button class="gb move" id="bRight">▶</button>
    </div>
    <div class="pad">
      <button class="gb jump" id="bJump">跳</button>
      <button class="gb sp" id="bSp"><span class="fill"></span>必殺</button>
      <button class="gb atk" id="bAtk">攻擊</button>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  /* ===== 卡通動物（程式畫）===== */
  function drawCreature(c, kind, x, y, s, o){
    o=o||{}; const t=o.t||0, mood=o.mood||"happy", flip=o.flip;
    const bob=Math.sin(t*3+(o.ph||0))*s*0.04;
    c.save(); c.translate(x,y+bob); if(flip) c.scale(-1,1); c.lineJoin="round"; c.lineCap="round";
    const eye=(ex,ey,r)=>{ c.fillStyle="#fff"; c.beginPath(); c.arc(ex,ey,r,0,7); c.fill();
      c.fillStyle="#222"; c.beginPath(); c.arc(ex,ey,r*0.55,0,7); c.fill(); };
    const brow=(ex,ey,w)=>{ c.strokeStyle="#3e2723"; c.lineWidth=s*0.05; c.beginPath(); c.moveTo(ex-w,ey-2); c.lineTo(ex+w,ey+2); c.stroke(); };
    if(kind==="leopard"){
      c.fillStyle="#e8a55c"; c.beginPath(); c.ellipse(0,s*0.35,s*0.55,s*0.5,0,0,7); c.fill();
      c.strokeStyle="#e8a55c"; c.lineWidth=s*0.16; c.beginPath(); c.moveTo(s*0.45,s*0.5); c.quadraticCurveTo(s*0.9,s*0.4,s*0.8,0); c.stroke();
      c.fillStyle="#e8a55c"; c.beginPath(); c.arc(0,-s*0.3,s*0.5,0,7); c.fill();
      c.beginPath(); c.moveTo(-s*0.45,-s*0.6); c.lineTo(-s*0.2,-s*0.75); c.lineTo(-s*0.15,-s*0.45); c.fill();
      c.beginPath(); c.moveTo(s*0.45,-s*0.6); c.lineTo(s*0.2,-s*0.75); c.lineTo(s*0.15,-s*0.45); c.fill();
      c.fillStyle="#3e2723"; c.beginPath(); c.arc(-s*0.32,-s*0.62,s*0.07,0,7); c.arc(s*0.32,-s*0.62,s*0.07,0,7); c.fill();
      c.fillStyle="#5d4037"; for(const p of [[-.3,.3],[.32,.28],[0,.55],[-.15,.1],[.18,.05]]){ c.beginPath(); c.arc(p[0]*s,(p[1]+0.1)*s,s*0.06,0,7); c.fill(); }
      c.strokeStyle="#5d4037"; c.lineWidth=s*0.05; c.beginPath(); c.moveTo(-s*0.12,-s*0.55); c.lineTo(-s*0.1,-s*0.3); c.moveTo(s*0.12,-s*0.55); c.lineTo(s*0.1,-s*0.3); c.stroke();
      c.fillStyle="#fff8f0"; c.beginPath(); c.ellipse(0,-s*0.12,s*0.26,s*0.2,0,0,7); c.fill();
      eye(-s*0.18,-s*0.32,s*0.1); eye(s*0.18,-s*0.32,s*0.1);
      if(mood==="angry"){ brow(-s*0.18,-s*0.46,s*0.12); brow(s*0.18,-s*0.46,s*0.12); }
      c.fillStyle="#e57373"; c.beginPath(); c.arc(0,-s*0.16,s*0.05,0,7); c.fill();
    } else if(kind==="bear"){
      c.fillStyle="#2b2b2b"; c.beginPath(); c.ellipse(0,s*0.35,s*0.6,s*0.55,0,0,7); c.fill();
      c.fillStyle="#fafafa"; c.beginPath(); c.moveTo(-s*0.18,s*0.1); c.lineTo(0,s*0.5); c.lineTo(s*0.18,s*0.1); c.closePath(); c.fill();
      c.fillStyle="#2b2b2b"; c.beginPath(); c.arc(0,-s*0.28,s*0.5,0,7); c.fill();
      c.beginPath(); c.arc(-s*0.42,-s*0.55,s*0.18,0,7); c.arc(s*0.42,-s*0.55,s*0.18,0,7); c.fill();
      c.fillStyle="#8d6e63"; c.beginPath(); c.ellipse(0,-s*0.1,s*0.28,s*0.22,0,0,7); c.fill();
      c.fillStyle="#222"; c.beginPath(); c.ellipse(0,-s*0.18,s*0.09,s*0.07,0,0,7); c.fill();
      eye(-s*0.2,-s*0.34,s*0.09); eye(s*0.2,-s*0.34,s*0.09);
      if(mood==="angry"){ brow(-s*0.2,-s*0.48,s*0.12); brow(s*0.2,-s*0.48,s*0.12); }
    } else if(kind==="cicada"){
      c.fillStyle="rgba(220,240,200,.55)"; c.beginPath(); c.ellipse(-s*0.35,s*0.1,s*0.5,s*0.24,-0.5,0,7); c.fill();
      c.beginPath(); c.ellipse(s*0.35,s*0.1,s*0.5,s*0.24,0.5,0,7); c.fill();
      c.fillStyle="#7cb342"; c.beginPath(); c.ellipse(0,s*0.05,s*0.3,s*0.5,0,0,7); c.fill();
      c.fillStyle="#558b2f"; c.beginPath(); c.arc(0,-s*0.35,s*0.32,0,7); c.fill();
      eye(-s*0.2,-s*0.38,s*0.12); eye(s*0.2,-s*0.38,s*0.12);
      if(mood==="angry"){ brow(-s*0.2,-s*0.54,s*0.12); brow(s*0.2,-s*0.54,s*0.12); }
    } else if(kind==="dragonfly"){
      c.fillStyle="rgba(180,235,245,.5)"; for(const a of [-0.6,0.6,-1.0,1.0]){ c.save(); c.rotate(a); c.beginPath(); c.ellipse(s*0.45,0,s*0.42,s*0.13,0,0,7); c.fill(); c.restore(); }
      c.fillStyle="#26c6da"; c.beginPath(); c.ellipse(0,s*0.2,s*0.13,s*0.6,0,0,7); c.fill();
      c.fillStyle="#00acc1"; c.beginPath(); c.arc(0,-s*0.42,s*0.26,0,7); c.fill();
      eye(-s*0.16,-s*0.46,s*0.14); eye(s*0.16,-s*0.46,s*0.14);
      if(mood==="angry"){ brow(-s*0.16,-s*0.62,s*0.12); brow(s*0.16,-s*0.62,s*0.12); }
    } else if(kind==="snail"){
      c.fillStyle="#c79a6b"; c.beginPath(); c.ellipse(-s*0.15,s*0.35,s*0.5,s*0.28,0,0,7); c.fill();
      c.fillStyle="#8d5524"; c.beginPath(); c.arc(s*0.15,-s*0.05,s*0.42,0,7); c.fill();
      c.strokeStyle="#5d3a17"; c.lineWidth=s*0.06; c.beginPath();
      for(let a=0;a<7;a+=0.2){ const rr=s*0.05*a,px=s*0.15+Math.cos(a*1.6)*rr,py=-s*0.05+Math.sin(a*1.6)*rr; a===0?c.moveTo(px,py):c.lineTo(px,py);} c.stroke();
      c.strokeStyle="#c79a6b"; c.lineWidth=s*0.05; c.beginPath(); c.moveTo(-s*0.4,s*0.2); c.lineTo(-s*0.52,-s*0.15); c.moveTo(-s*0.28,s*0.18); c.lineTo(-s*0.34,-s*0.18); c.stroke();
      c.fillStyle="#222"; c.beginPath(); c.arc(-s*0.52,-s*0.17,s*0.06,0,7); c.arc(-s*0.34,-s*0.2,s*0.06,0,7); c.fill();
      brow(-s*0.45,-s*0.3,s*0.1);
    } else if(kind==="iguana"){
      c.fillStyle="#7cb342"; c.beginPath(); c.ellipse(0,s*0.3,s*0.58,s*0.32,0,0,7); c.fill();
      c.strokeStyle="#558b2f"; c.lineWidth=s*0.14; c.beginPath(); c.moveTo(s*0.5,s*0.35); c.quadraticCurveTo(s*0.95,s*0.3,s*1.0,0); c.stroke();
      c.fillStyle="#689f38"; for(let i=-2;i<=3;i++){ c.beginPath(); c.moveTo(i*s*0.16,0); c.lineTo(i*s*0.16+s*0.05,-s*0.16); c.lineTo(i*s*0.16+s*0.1,0); c.fill(); }
      c.fillStyle="#7cb342"; c.beginPath(); c.ellipse(-s*0.5,s*0.15,s*0.3,s*0.26,0,0,7); c.fill();
      c.fillStyle="#aed581"; c.beginPath(); c.ellipse(-s*0.55,s*0.4,s*0.16,s*0.12,0,0,7); c.fill();
      eye(-s*0.6,s*0.05,s*0.1); brow(-s*0.6,-s*0.08,s*0.1);
    } else if(kind==="frog"){
      c.fillStyle="#8d6e63"; c.beginPath(); c.ellipse(0,s*0.3,s*0.55,s*0.42,0,0,7); c.fill();
      c.fillStyle="#6d4c41"; for(const p of [[-.3,.45],[.3,.45],[-.1,.55],[.15,.3]]){ c.beginPath(); c.arc(p[0]*s,p[1]*s,s*0.07,0,7); c.fill(); }
      c.fillStyle="#a1887f"; c.beginPath(); c.arc(-s*0.28,-s*0.18,s*0.2,0,7); c.arc(s*0.28,-s*0.18,s*0.2,0,7); c.fill();
      eye(-s*0.28,-s*0.2,s*0.13); eye(s*0.28,-s*0.2,s*0.13);
      if(mood!=="happy"){ brow(-s*0.28,-s*0.38,s*0.13); brow(s*0.28,-s*0.38,s*0.13); }
    } else if(kind==="ibis"){
      c.fillStyle="#fafafa"; c.beginPath(); c.ellipse(0,s*0.25,s*0.5,s*0.4,0,0,7); c.fill();
      c.fillStyle="#222"; c.beginPath(); c.arc(-s*0.2,-s*0.3,s*0.26,0,7); c.fill();
      c.strokeStyle="#222"; c.lineWidth=s*0.08; c.beginPath(); c.moveTo(-s*0.4,-s*0.28); c.quadraticCurveTo(-s*0.85,-s*0.2,-s*0.8,s*0.15); c.stroke();
      eye(-s*0.18,-s*0.34,s*0.08); brow(-s*0.18,-s*0.46,s*0.1);
    }
    c.restore();
  }

  /* ===== 角色與魔王資料 ===== */
  const HEROES = [
    { key:"leopard", name:"石虎", speed:235, atkDmg:7, atkCd:0.33, reach:64, spName:"突刺", spCd:4.5 },
    { key:"bear",    name:"黑熊", speed:160, atkDmg:12,atkCd:0.6,  reach:78, spName:"震地", spCd:6.0 },
    { key:"cicada",  name:"爺蟬", speed:185, atkDmg:6, atkCd:0.4,  reach:60, spName:"音波", spCd:5.0 },
    { key:"dragonfly",name:"勾蜓",speed:265, atkDmg:6, atkCd:0.3,  reach:60, spName:"疾風", spCd:4.5 },
  ];
  const CH = [
    { place:"稻田", bg:"paddy", hero:0, boss:{kind:"snail", name:"福壽螺王", hp:120, r:62, dmg:14},
      intro:[ {s:0,m:"happy",t:"我是石虎，淺山的夜行獵手！"},
              {s:0,m:"angry",t:"福壽螺王把整片稻田都啃光了，還愈長愈大隻…"},
              {s:0,m:"happy",t:"看我的！等牠出招後露出破綻，我就衝上去咬牠！下面：◀▶移動、跳、攻擊、必殺(突刺)。"} ],
      outro:[ {s:0,m:"happy",t:"贏了！稻田保住了。下一個敵人在淺山等著…"} ] },
    { place:"淺山", bg:"hill", hero:1, boss:{kind:"iguana", name:"綠鬣蜥王", hp:165, r:72, dmg:16},
      intro:[ {s:1,m:"happy",t:"換我了，台灣黑熊！胸口的白 V 是月亮的印記。"},
              {s:1,m:"angry",t:"綠鬣蜥王又肥又硬，普通攻擊不夠看。"},
              {s:1,m:"happy",t:"必殺『震地』可以打牠一大片！趁牠衝完累了，重拳招呼。"} ],
      outro:[ {s:1,m:"happy",t:"這點重量難不倒我。溪流那邊好像也有狀況…"} ] },
    { place:"溪流", bg:"stream", hero:2, boss:{kind:"frog", name:"斑腿樹蛙王", hp:200, r:66, dmg:14},
      intro:[ {s:2,m:"happy",t:"吱———！我是台灣爺蟬，全世界最大的蟬。"},
              {s:2,m:"angry",t:"斑腿樹蛙王跳得又快又高，一直搶我們的家。"},
              {s:2,m:"happy",t:"必殺『音波』是遠程的，還能把牠震暈！趁牠暈了狂攻。"} ],
      outro:[ {s:2,m:"happy",t:"安靜下來了…最後的決戰，在濕地。"} ] },
    { place:"濕地", bg:"wetland", hero:3, boss:{kind:"ibis", name:"埃及聖䴉王", hp:255, r:70, dmg:16},
      intro:[ {s:3,m:"happy",t:"嗡嗡嗡！無霸勾蜓，台灣飛最快的蜻蜓！"},
              {s:3,m:"angry",t:"埃及聖䴉王從天上來，搶黑面琵鷺的家。這是最後一戰！"},
              {s:3,m:"happy",t:"必殺『疾風』超快、還能閃過攻擊！打倒牠，守住台灣！"} ],
      outro:[ {s:3,m:"happy",t:"我們贏了！"},
              {s:0,m:"happy",t:"這些動物都是真的，正在消失。記得牠們，就是最好的守護。"} ] },
  ];

  /* ===== DOM ===== */
  const canvas=document.getElementById("game"), ctx=canvas.getContext("2d");
  const dock=document.getElementById("dock");
  const titleScr=document.getElementById("title"), mapScr=document.getElementById("map"),
        resultScr=document.getElementById("result"), storyScr=document.getElementById("story");
  const bSp=document.getElementById("bSp");

  let W=0,H=0,GY=0,dpr=1;
  function resize(){ const r=canvas.getBoundingClientRect(); W=r.width; H=r.height; GY=H*0.82;
    dpr=Math.min(window.devicePixelRatio||1,2); canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr); ctx.setTransform(dpr,0,0,dpr,0,0); }
  window.addEventListener("resize",resize);

  function getUnlocked(){ try{ return parseInt(localStorage.getItem("shoutu_unlocked")||"0",10)||0; }catch(e){ return 0; } }
  function setUnlocked(v){ try{ localStorage.setItem("shoutu_unlocked",String(v)); }catch(e){} }

  /* ===== 狀態 ===== */
  let state="title", chapter=0, elapsed=0, shake=0;
  let hero, boss, heroDef, projs, fx, floaters;
  const GRAV=1700, JUMP=-620;
  const input={ left:false, right:false };

  function show(scr){ [titleScr,mapScr,resultScr].forEach(s=>s.classList.add("hide")); storyScr.classList.add("hide"); if(scr) scr.classList.remove("hide"); }
  function setBattleUI(on){ dock.classList.toggle("hide",!on); }
  function goTitle(){ state="title"; setBattleUI(false); show(titleScr); }

  function goMap(){ state="map"; setBattleUI(false); show(mapScr);
    const cards=document.getElementById("cards"); cards.innerHTML=""; const unlocked=getUnlocked();
    CH.forEach((c,i)=>{ const div=document.createElement("div"); div.className="card"+(i>unlocked?" locked":"")+(i<unlocked?" cleared":"");
      const cv=document.createElement("canvas"); cv.width=108; cv.height=108; div.appendChild(cv);
      const info=document.createElement("div"); info.className="info";
      info.innerHTML=`<div class="t">第${i+1}章 · ${c.place}</div><div class="d">${HEROES[c.hero].name} VS ${c.boss.name}</div>`;
      div.appendChild(info); const st=document.createElement("div"); st.className="st"; st.textContent=i<unlocked?"✅":(i>unlocked?"🔒":"▶"); div.appendChild(st);
      drawCreature(cv.getContext("2d"),HEROES[c.hero].key,54,62,38,{t:0});
      if(i<=unlocked) div.onclick=()=>startChapter(i); cards.appendChild(div); });
  }

  /* ===== 對話 ===== */
  let dlg=null,dlgIdx=0,dlgAfter=null;
  function playStory(lines,after){ state="story"; setBattleUI(false); show(null); storyScr.classList.remove("hide"); drawStoryBg(); dlg=lines; dlgIdx=0; dlgAfter=after; renderLine(); }
  function renderLine(){ const ln=dlg[dlgIdx], h=HEROES[ln.s];
    document.getElementById("spk").textContent=h.name; document.getElementById("line").textContent=ln.t;
    const px=document.getElementById("portrait").getContext("2d"); px.clearRect(0,0,128,128); drawCreature(px,h.key,64,72,46,{t:0,mood:ln.m}); }
  function advance(){ dlgIdx++; if(dlgIdx>=dlg.length){ const a=dlgAfter; dlg=null; if(a)a(); } else renderLine(); }
  function drawStoryBg(){ const sb=document.getElementById("storybg"), r=storyScr.getBoundingClientRect(); sb.width=r.width; sb.height=r.height; paintBackground(sb.getContext("2d"),r.width,r.height,CH[chapter].bg); }
  storyScr.addEventListener("pointerdown",(e)=>{ e.preventDefault(); if(state==="story") advance(); },{passive:false});

  /* ===== 開始戰鬥 ===== */
  function startChapter(i){ chapter=i; playStory(CH[i].intro, beginBattle); }
  function beginBattle(){ const c=CH[chapter]; heroDef=HEROES[c.hero]; state="play"; setBattleUI(true); show(null);
    elapsed=0; shake=0; projs=[]; fx=[]; floaters=[]; input.left=input.right=false;
    hero={ key:heroDef.key, x:W*0.22, y:GY-28, vy:0, onGround:true, face:1, hp:100, maxhp:100,
      atkT:0, atkCd:0, atkHit:false, spCd:0, invuln:0, hitT:0, dashT:0, dashDir:1, foot:28 };
    const b=c.boss; boss={ kind:b.kind, name:b.name, x:W*0.78, y:GY-b.r*0.7, vy:0, onGround:true, face:-1,
      hp:b.hp, maxhp:b.hp, r:b.r, dmg:b.dmg, foot:b.r*0.7, st:"idle", t:1.0, stun:0, danger:false, atk:null, hitT:0 };
    updateSp();
  }

  /* ===== 英雄動作 ===== */
  function heroAttack(){ if(state!=="play"||hero.atkCd>0||hero.dashT>0) return; hero.atkT=0.22; hero.atkCd=heroDef.atkCd; hero.atkHit=false;
    hero.x += hero.face*10; }
  function heroJump(){ if(state!=="play"||!hero.onGround) return; hero.vy=JUMP; hero.onGround=false; }
  function heroSpecial(){ if(state!=="play"||hero.spCd>0) return; const k=hero.key; hero.spCd=heroDef.spCd;
    if(k==="leopard"||k==="dragonfly"){ hero.dashT=(k==="dragonfly")?0.34:0.26; hero.dashDir=hero.face; hero.invuln=Math.max(hero.invuln,hero.dashT+0.05); hero.spDmg=(k==="dragonfly")?24:20; hero.spHit=false; flo(hero.x,hero.y-50,heroDef.spName+"!","#fff59d"); }
    else if(k==="bear"){ hero.vy=JUMP*0.7; hero.slamPending=true; flo(hero.x,hero.y-50,"震地!","#fff59d"); }
    else if(k==="cicada"){ projs.push({from:"hero",x:hero.x+hero.face*30,y:hero.y-20,vx:hero.face*460,vy:0,r:18,dmg:16,stun:true,life:1.6,kind:"sonic"}); flo(hero.x,hero.y-50,"音波!","#fff59d"); }
    updateSp();
  }
  function hurtHero(dmg,fromX){ if(hero.invuln>0) return; hero.hp-=dmg; hero.invuln=1.0; hero.hitT=0.3; shake=Math.max(shake,10);
    hero.vy=-260; hero.onGround=false; hero.x += (hero.x<fromX?-1:1)*30; flo(hero.x,hero.y-50,"-"+dmg,"#ff8a80");
    if(hero.hp<=0){ hero.hp=0; loseChapter(); } }
  function hitBoss(dmg,stun){ boss.hp-=dmg; boss.hitT=0.18; flo(boss.x,boss.y-boss.r-10,"-"+dmg,"#fff");
    if(stun){ boss.stun=Math.max(boss.stun,1.3); boss.st="idle"; boss.danger=false; }
    if(boss.hp<=0){ boss.hp=0; winChapter(); } }

  /* ===== 魔王 AI ===== */
  function bossPick(){ const gap=Math.abs(hero.x-boss.x); const r=(Math.floor(elapsed*7)+boss.hp)%3;
    if(gap>W*0.4) return "charge"; if(r===0) return "charge"; if(r===1) return "slam"; return "spit"; }
  function bossUpdate(dt){ if(boss.hitT>0) boss.hitT-=dt;
    boss.face = hero.x<boss.x ? -1 : 1;
    if(boss.stun>0){ boss.stun-=dt; boss.danger=false; return; }
    // 重力
    boss.vy+=GRAV*dt; boss.y+=boss.vy*dt; const by=GY-boss.foot; if(boss.y>=by){ if(!boss.onGround&&boss.atk==="slam"&&boss.st==="attack"){ // 落地震波
          projs.push({from:"bossWave",x:boss.x,y:GY,vx:-280,r:20,dmg:13,life:1.4}); projs.push({from:"bossWave",x:boss.x,y:GY,vx:280,r:20,dmg:13,life:1.4}); shake=Math.max(shake,9); boss.st="recover"; boss.t=1.0; }
        boss.y=by; boss.vy=0; boss.onGround=true; }
    switch(boss.st){
      case "idle": { const gap=hero.x-boss.x, d=Math.abs(gap); const want = d<W*0.28? -Math.sign(gap):Math.sign(gap);
        boss.x += want*60*dt; boss.t-=dt; if(boss.t<=0){ boss.atk=bossPick(); boss.st="tele"; boss.t=0.75; } break; }
      case "tele": { boss.t-=dt; if(boss.t<=0){ boss.st="attack"; boss.danger=true;
          if(boss.atk==="charge"){ boss.cv=Math.sign(hero.x-boss.x)*Math.max(360,W*0.9); boss.t=0.55; }
          else if(boss.atk==="slam"){ boss.vy=JUMP*0.95; boss.onGround=false; boss.t=2.0; }
          else if(boss.atk==="spit"){ for(let i=0;i<3;i++){ const ang=-0.5-i*0.25; projs.push({from:"boss",x:boss.x+boss.face*boss.r*0.6,y:boss.y-boss.r*0.4,vx:boss.face*(300+i*30),vy:-260+i*60,r:14,dmg:10,life:2.4,grav:true}); } boss.danger=false; boss.st="recover"; boss.t=0.9; }
        } break; }
      case "attack": { if(boss.atk==="charge"){ boss.x+=boss.cv*dt; boss.t-=dt;
          if(boss.x<boss.r){ boss.x=boss.r; } if(boss.x>W-boss.r){ boss.x=W-boss.r; }
          if(boss.t<=0){ boss.danger=false; boss.st="recover"; boss.t=1.1; } }
        else if(boss.atk==="slam"){ boss.t-=dt; if(boss.t<=0&&boss.onGround){ boss.st="recover"; boss.t=1.0; } }
        break; }
      case "recover": { boss.danger=false; boss.t-=dt; if(boss.t<=0){ boss.st="idle"; boss.t=0.7+Math.random()*0.6; } break; }
    }
    boss.x=Math.max(boss.r,Math.min(W-boss.r,boss.x));
    // 魔王身體傷害（攻擊中）
    if(boss.danger && hero.invuln<=0){ const dx=Math.abs(hero.x-boss.x), dy=Math.abs(hero.y-boss.y);
      if(dx<boss.r+18 && dy<boss.r){ hurtHero(boss.dmg,boss.x); } }
  }

  /* ===== 更新 ===== */
  function update(dt){ elapsed+=dt; if(shake>0) shake=Math.max(0,shake-dt*40);
    // 計時器
    if(hero.atkCd>0)hero.atkCd-=dt; if(hero.atkT>0)hero.atkT-=dt; if(hero.spCd>0){hero.spCd-=dt; updateSp();}
    if(hero.invuln>0)hero.invuln-=dt; if(hero.hitT>0)hero.hitT-=dt;
    // 移動
    let mv=0; if(input.left)mv-=1; if(input.right)mv+=1; if(mv!==0){ hero.face=mv; }
    if(hero.dashT>0){ hero.x+=hero.dashDir*620*dt; hero.dashT-=dt; }
    else hero.x+=mv*heroDef.speed*dt;
    hero.x=Math.max(20,Math.min(W-20,hero.x));
    // 重力
    hero.vy+=GRAV*dt; hero.y+=hero.vy*dt; const hy=GY-hero.foot;
    if(hero.y>=hy){ if(!hero.onGround&&hero.slamPending){ hero.slamPending=false; projs.push({from:"heroWave",x:hero.x,y:GY,vx:-360,r:20,dmg:0,life:0.5}); projs.push({from:"heroWave",x:hero.x,y:GY,vx:360,r:20,dmg:0,life:0.5}); if(Math.abs(hero.x-boss.x)<160){ hitBoss(20); } shake=Math.max(shake,9); }
      hero.y=hy; hero.vy=0; hero.onGround=true; }
    // 基本攻擊命中
    if(hero.atkT>0 && !hero.atkHit){ const gap=Math.abs(hero.x-boss.x)-boss.r; const facing=(boss.x-hero.x)*hero.face>=0;
      if(gap<heroDef.reach && facing){ hitBoss(heroDef.atkDmg); hero.atkHit=true; } }
    // 突刺/疾風命中
    if(hero.dashT>0 && !hero.spHit && (hero.key==="leopard"||hero.key==="dragonfly")){ if(Math.abs(hero.x-boss.x)<boss.r+26){ hitBoss(hero.spDmg); hero.spHit=true; } }

    bossUpdate(dt);

    // 投射物
    for(const p of projs){ p.life-=dt; p.x+=p.vx*dt; if(p.grav){ p.vy+=GRAV*dt; p.y+=p.vy*dt; if(p.y>GY){ p.y=GY; p.life=0; } }
      if(p.from==="bossWave"||p.from==="boss"){ if(hero.invuln<=0){ const onGround=hero.onGround;
          if(p.from==="bossWave"){ if(onGround && Math.abs(hero.x-p.x)<24){ hurtHero(p.dmg,p.x); p.life=0; } }
          else { if(Math.hypot(hero.x-p.x,hero.y-p.y)<22){ hurtHero(p.dmg,p.x); p.life=0; } } } }
      if(p.from==="hero"){ if(Math.abs(p.x-boss.x)<boss.r && Math.abs(p.y-boss.y)<boss.r){ hitBoss(p.dmg,p.stun); p.life=0; } }
    }
    projs=projs.filter(p=>p.life>0 && p.x>-60 && p.x<W+60);
    for(const f of floaters){ f.life-=dt; f.y-=24*dt; } floaters=floaters.filter(f=>f.life>0);
  }
  function updateSp(){ const r=Math.max(0,hero?hero.spCd:0); bSp.querySelector(".fill").style.height=(r/heroDef.spCd*100)+"%"; bSp.classList.toggle("ready", r<=0); }

  function winChapter(){ if(state!=="play")return; state="post"; setBattleUI(false);
    const was=getUnlocked(); if(chapter+1>was) setUnlocked(Math.min(CH.length,chapter+1));
    playStory(CH[chapter].outro, ()=>{ const last=chapter>=CH.length-1;
      showResult("🏆 打倒 "+CH[chapter].boss.name+"！", last?"全戰役完成！":"章節過關",
        last?"你打倒了所有入侵種的王，守住了台灣每一個家。<br>這些動物都是真實、正在消失的生命——你記住牠們了。":"新夥伴加入了隊伍，往下一章前進！",
        last?"再玩一次":"下一章 ▶", last?goMap:()=>startChapter(chapter+1)); }); }
  function loseChapter(){ if(state!=="play")return; state="lose"; setBattleUI(false);
    showResult("被擊倒了…", CH[chapter].boss.name+"太強了", "撐住！等魔王出招『後』再上去打，被打就先閃。<br>必殺也能閃過攻擊喔！", "再挑戰一次", ()=>startChapter(chapter)); }
  function showResult(title,sub,body,mainTxt,mainFn){ state="result"; show(resultScr);
    document.getElementById("rTitle").textContent=title; document.getElementById("rSub").textContent=sub;
    document.getElementById("rBody").innerHTML=body; const mb=document.getElementById("rMain"); mb.textContent=mainTxt; mb.onclick=mainFn; }

  function flo(x,y,txt,col){ floaters.push({x,y,txt,col,life:0.7}); }

  /* ===== 背景 ===== */
  function paintBackground(c,w,h,bg){ let top="#1b5e20",bot="#33691e";
    if(bg==="paddy"){top="#cfe8a0";bot="#9ccc65";} else if(bg==="hill"){top="#a5d6a7";bot="#66946a";}
    else if(bg==="stream"){top="#9fd8f0";bot="#4fa6c9";} else if(bg==="wetland"){top="#a7d7cf";bot="#5a9a8f";}
    const g=c.createLinearGradient(0,0,0,h); g.addColorStop(0,top); g.addColorStop(1,bot); c.fillStyle=g; c.fillRect(0,0,w,h);
    // 遠景
    c.globalAlpha=0.18; c.fillStyle="#2e7d32";
    c.beginPath(); c.moveTo(0,h*0.62); c.quadraticCurveTo(w*0.3,h*0.46,w*0.55,h*0.6); c.quadraticCurveTo(w*0.8,h*0.72,w,h*0.55); c.lineTo(w,h); c.lineTo(0,h); c.fill();
    c.globalAlpha=1;
  }
  function drawGround(){ ctx.fillStyle="#5d4037"; ctx.fillRect(0,GY,W,H-GY);
    ctx.fillStyle="#6d4c41"; ctx.fillRect(0,GY,W,6);
    ctx.strokeStyle="rgba(0,0,0,.12)"; ctx.lineWidth=2; for(let x=0;x<W;x+=28){ ctx.beginPath(); ctx.moveTo(x,GY+12); ctx.lineTo(x+10,GY+12); ctx.stroke(); } }

  /* ===== 繪製 ===== */
  function hpBar(x,y,w,frac,col,name,faceKind){ ctx.fillStyle="rgba(0,0,0,.45)"; ctx.fillRect(x,y,w,14); ctx.fillStyle=col; ctx.fillRect(x,y,w*Math.max(0,frac),14);
    ctx.strokeStyle="rgba(255,255,255,.5)"; ctx.lineWidth=2; ctx.strokeRect(x,y,w,14);
    ctx.fillStyle="#fff"; ctx.font="bold 13px sans-serif"; ctx.textBaseline="alphabetic"; ctx.fillText(name,x,y-5); }
  function draw(){ ctx.save(); if(shake>0) ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
    paintBackground(ctx,W+1,H+1,CH[chapter]?CH[chapter].bg:"paddy"); drawGround();
    // 投射物
    for(const p of projs){ if(p.from==="bossWave"||p.from==="heroWave"){ ctx.fillStyle=p.from==="bossWave"?"rgba(180,120,80,.6)":"rgba(180,220,140,.5)"; ctx.beginPath(); ctx.ellipse(p.x,GY-6,p.r,p.r*0.5,0,0,7); ctx.fill(); }
      else if(p.from==="boss"){ ctx.fillStyle="#7e57c2"; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); }
      else if(p.kind==="sonic"){ ctx.strokeStyle="rgba(174,213,129,.9)"; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(p.x,p.y,16,0,7); ctx.stroke(); } }
    // 魔王
    ctx.textAlign="left"; ctx.textBaseline="middle";
    const bflash=boss.hitT>0; if(bflash) ctx.globalAlpha=0.6;
    const tele=(boss.st==="tele"); if(tele && Math.floor(elapsed*12)%2===0) ctx.globalAlpha=0.7;
    drawCreature(ctx,boss.kind,boss.x,boss.y,boss.r,{t:elapsed,mood:"angry",flip:boss.face>0}); ctx.globalAlpha=1;
    if(tele){ ctx.fillStyle="#ff5252"; ctx.font="bold 30px sans-serif"; ctx.textAlign="center"; ctx.fillText("!",boss.x,boss.y-boss.r-14); }
    if(boss.stun>0){ ctx.font="20px serif"; ctx.textAlign="center"; ctx.fillText("💫",boss.x,boss.y-boss.r-10); }
    // 英雄（被擊中閃爍、無敵閃爍）
    let ha=1; if(hero.invuln>0 && Math.floor(elapsed*16)%2===0) ha=0.4; ctx.globalAlpha=ha;
    drawCreature(ctx,hero.key,hero.x,hero.y,32,{t:elapsed,mood:hero.hitT>0?"angry":"happy",flip:hero.face<0}); ctx.globalAlpha=1;
    if(hero.atkT>0){ ctx.strokeStyle="rgba(255,255,255,.85)"; ctx.lineWidth=5; ctx.beginPath(); ctx.arc(hero.x+hero.face*36,hero.y-6,26,-0.8,0.8); ctx.stroke(); }
    // 浮字
    ctx.textAlign="center"; for(const f of floaters){ ctx.globalAlpha=Math.min(1,f.life*1.6); ctx.fillStyle=f.col; ctx.font="bold 16px sans-serif"; ctx.fillText(f.txt,f.x,f.y); ctx.globalAlpha=1; }
    // 血條（對戰 UI）
    hpBar(14,30,W*0.40,hero.hp/hero.maxhp,"#66bb6a",HEROES[CH[chapter].hero].name,hero.key);
    hpBar(W-14-W*0.40,30,W*0.40,boss.hp/boss.maxhp,"#ef5350",boss.name,boss.kind);
    ctx.fillStyle="rgba(255,255,255,.85)"; ctx.font="bold 12px sans-serif"; ctx.textAlign="center"; ctx.fillText("第"+(chapter+1)+"章 · "+CH[chapter].place,W/2,40);
    ctx.restore();
  }

  /* ===== 迴圈 ===== */
  let last=0;
  function frame(ts){ const dt=Math.min(0.04,(ts-last)/1000||0); last=ts; if(state==="play"){ update(dt); draw(); } else if(state==="lose"||state==="result"){ draw(); } requestAnimationFrame(frame); }

  /* ===== 輸入 ===== */
  function hold(btn,flag){ const b=document.getElementById(btn);
    const on=(e)=>{ e.preventDefault(); input[flag]=true; b.classList.add("on"); };
    const off=(e)=>{ e.preventDefault(); input[flag]=false; b.classList.remove("on"); };
    b.addEventListener("pointerdown",on); b.addEventListener("pointerup",off); b.addEventListener("pointerleave",off); b.addEventListener("pointercancel",off); }
  hold("bLeft","left"); hold("bRight","right");
  const tap=(id,fn)=>document.getElementById(id).addEventListener("pointerdown",(e)=>{ e.preventDefault(); fn(); },{passive:false});
  tap("bJump",heroJump); tap("bAtk",heroAttack); tap("bSp",heroSpecial);
  canvas.addEventListener("pointerdown",(e)=>{ if(state!=="play")return; e.preventDefault(); heroAttack(); },{passive:false});
  document.getElementById("toMap").onclick=goMap; document.getElementById("rMap").onclick=goMap;
  document.getElementById("resetProg").onclick=()=>{ setUnlocked(0); goMap(); };
  window.addEventListener("keydown",(e)=>{ if(state==="play"){ if(e.key==="ArrowLeft"||e.key==="a")input.left=true; else if(e.key==="ArrowRight"||e.key==="d")input.right=true;
      else if(e.key==="ArrowUp"||e.key==="w"||e.code==="Space"){ e.preventDefault(); heroJump(); } else if(e.key==="j"||e.key==="Enter")heroAttack(); else if(e.key==="k"||e.key==="Shift")heroSpecial(); }
    else if(state==="story"&&e.code==="Space"){ e.preventDefault(); advance(); } });
  window.addEventListener("keyup",(e)=>{ if(e.key==="ArrowLeft"||e.key==="a")input.left=false; else if(e.key==="ArrowRight"||e.key==="d")input.right=false; });

  resize(); goTitle(); requestAnimationFrame(frame);
  if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
})();
</script>
</body>
